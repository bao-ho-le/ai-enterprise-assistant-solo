spring.application.name=backend
server.port=${PORT:8080}
api.prefix=/api/v1
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===============================
# Admin seed
# ===============================
admin.seed.username=${ADMIN_USERNAME}
admin.seed.email=${ADMIN_EMAIL}
admin.seed.password=${ADMIN_PASSWORD}
admin.seed.full-name=${ADMIN_FULL_NAME}


# ===============================
# Database connection
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# ===============================
# JWT Configuration
# ===============================
jwt.access-token.secret=${JWT_ACCESS_SECRET}
jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-token.secret=${JWT_REFRESH_SECRET}
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION}

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
file.upload.max-size=500MB


# ===============================
# MinIO Configuration
# ===============================
minio.provider=MINIO
minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}



# ===============================
# Qdrant Configuration
# ===============================
qdrant.host=${QDRANT_HOST}
qdrant.grpc-port=${QDRANT_GRPC_PORT}
qdrant.rest-port=${QDRANT_REST_PORT}
qdrant.collection-name=document_chunks
qdrant.vector-size=3072
# Cosine similarity toi thieu de 1 ket qua duoc coi la lien quan (0..1). Can tune thuc nghiem.
qdrant.score-threshold=0.65
qdrant.use-tls=false
qdrant.api-key=${QDRANT_API_KEY}


# ===============================
# Embedding Configuration
# ===============================
gemini.api-key=${GEMINI_API_KEY}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL}

# ===============================
# LLM Configuration
# ===============================
gemini.llm-model.api-key=${GEMINI_LLM_MODEL_API_KEY}
gemini.llm-model.model-name=${GEMINI_LLM_MODEL_NAME}
gemini.llm-model.temperature=0.2
